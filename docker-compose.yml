version: "3.9"

# AUDIT FIX: mysql/redis ports were published on every interface
# (0.0.0.0), not just this machine -- redis in particular runs with no
# --requirepass at all, so anyone who could reach port 6379 on this
# host's network had full unauthenticated read/write access. Binding
# both to 127.0.0.1 is functionally identical for the intended use
# (the app runs on this same machine and connects via localhost either
# way) and only changes the insecure case: another host on the same
# network/Wi-Fi/shared box being able to reach either service.

services:
  mysql:
    image: mysql:8.0
    container_name: monitoring-mysql
    restart: unless-stopped
    ports:
      - "127.0.0.1:3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: monitoring-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data

volumes:
  mysql_data:
  redis_data: