# Host agent ingest/enroll rate limits (phase F). These two directives live in the http context
# (sites-available files are included inside http{}), so they sit OUTSIDE the server block.
#   enroll: per client IP, 20/hour is the app's own limit (HOST_AGENT_ENROLL_RATE_PER_HOUR); nginx is the
#           outer fence that still works when Redis is down (the app limiter fails open).
#   ingest: per client IP, generous (NAT: many hosts can share one egress IP); the per-token limit
#           (HOST_AGENT_INGEST_RATE_PER_MIN) is enforced by the app.
limit_req_zone  $binary_remote_addr  zone=ha_enroll:1m  rate=30r/m;
limit_req_zone  $binary_remote_addr  zone=ha_ingest:5m  rate=600r/m;
limit_req_zone  $binary_remote_addr  zone=ha_dl:1m      rate=60r/m;
limit_conn_zone $binary_remote_addr  zone=ha_conn:5m;

upstream monitoring_hub_agents {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # Frontend — serve built React files
    root /opt/monitoring-hub/app/frontend/dist;
    index index.html;

    # React router — all unknown paths → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Host agent channel (phase F). Matched BEFORE the generic /api/ prefix (longest prefix wins).
    # No add_header / proxy_hide_header here on purpose: a location that declares its own add_header
    # stops inheriting the server-level security headers (deploy/apply_security_headers.sh).
    # Request buffering stays ON: nginx reads the whole body (client_body_timeout applies, so a
    # slow-loris sender never ties up a uvicorn worker) and only then forwards it.
    # Must be updated together with HOST_AGENT_MAX_BODY_BYTES in .env (default 262144 = 256k).
    location = /api/host-agents/ingest {
        client_max_body_size      256k;
        client_body_timeout       10s;
        client_body_buffer_size   256k;
        limit_req   zone=ha_ingest burst=60 nodelay;
        limit_req_status 429;
        limit_conn  ha_conn 20;
        limit_conn_status 429;

        proxy_pass http://monitoring_hub_agents;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering on;
        proxy_connect_timeout 5s;
        proxy_send_timeout    15s;
        proxy_read_timeout    20s;
    }

    location = /api/host-agents/enroll {
        client_max_body_size      16k;
        client_body_timeout       10s;
        limit_req   zone=ha_enroll burst=10 nodelay;
        limit_req_status 429;
        limit_conn  ha_conn 10;
        limit_conn_status 429;

        proxy_pass http://monitoring_hub_agents;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering on;
        proxy_connect_timeout 5s;
        proxy_send_timeout    15s;
        proxy_read_timeout    20s;
    }

    # Host agent downloads (phase F): install.sh, cloudops-agent-<os>-<arch>, SHA256SUMS(.sig), manifest.json(.sig),
    # staged by scripts/host_agent_release.sh into /opt/monitoring-hub/host-agent-dist/<version>/ (versions are immutable).
    # Public on purpose (no secrets in these files); integrity comes from the signature, not from secrecy. An absent
    # directory simply answers 404. Same rule as above: no add_header here.
    location ^~ /dl/host-agent/ {
        alias /opt/monitoring-hub/host-agent-dist/;
        autoindex off;
        default_type application/octet-stream;
        limit_req zone=ha_dl burst=20 nodelay;
        limit_req_status 429;
        limit_except GET HEAD { deny all; }
    }

    # Backend API proxy
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }

    # WebSocket
    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # AUDIT FIX (i01/073, LOW): removed -- this proxied to a /admin/ path
    # prefix that doesn't exist anywhere in the FastAPI backend. Every
    # admin-facing router (accounts/users/groups/roles/rbac/status-page)
    # is mounted under /api/admin/... or /api/rbac/... (see app/main.py
    # and app/api/admin/*.py), already covered by the /api/ location
    # above. This block was dead config that only added confusion about
    # where admin routes actually live.
}

# TLS is NOT enabled by this template (fresh installs start on plain HTTP).
# Run deploy/enable_tls.sh on the server to add HTTPS to the live config
# (audit B01 F5). Re-run it after any full deploy.sh, which regenerates this file.
